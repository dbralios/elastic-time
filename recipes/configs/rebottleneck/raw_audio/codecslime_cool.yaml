data_root: /path/to/data
autoencoder_checkpoint_path: /path/to/stable-audio-open/model.ckpt
sample_rate: 44100
sample_size: 196608 # 96 latent frames at 2048x downsampling
output_root: /path/to/experiments

autoencoder:
  _component_: external.stable_audio_tools.src.models.autoencoders.create_autoencoder_from_config
  config:
    sample_rate: ${sample_rate}
    model:
      encoder:
        type: oobleck
        requires_grad: false
        config:
          in_channels: 2
          channels: 128
          c_mults: [1, 2, 4, 8, 16]
          strides: [2, 4, 4, 8, 8]
          latent_dim: 128
          use_snake: true
      decoder:
        type: oobleck
        config:
          out_channels: 2
          channels: 128
          c_mults: [1, 2, 4, 8, 16]
          strides: [2, 4, 4, 8, 8]
          latent_dim: 64
          use_snake: true
          final_tanh: false
      bottleneck:
        type: vae
      latent_dim: 64
      downsampling_ratio: 2048
      io_channels: 2
  checkpoint_path: ${autoencoder_checkpoint_path}
  checkpoint_loader_util_fn_cfg:
    _component_: rebots.utils.checkpoint_loaders.get_checkpoint_loader_util_fn
    name: stable_audio_open

melt_exp_name: rebot-raw-codecslime-melt-predictor

model:
  _component_: rebots.models.rebottlenecks.ReBottleneck
  checkpoint_path: ${output_root}/${melt_exp_name}/ckpt_epoch_19.pt
  encoder:
    _component_: rebots.models.components.convnext_stacks.ConvNeXtStack
    input_dim: 64
    num_blocks: 6
    hidden_dim: 1024
    output_dim: 128
  decoder:
    _component_: rebots.models.components.convnext_stacks.ConvNeXtStack
    input_dim: 64
    num_blocks: 6
    hidden_dim: 1024
    output_dim: 64
  bottleneck:
    _component_: rebots.modules.vae.VAEBottleneck
freeze_encoder: true

discriminator:
  _component_: rebots.models.discriminators.LatentDiscriminator
  hidden_dim: 256

max_segment_length: 4
masker:
  _component_: rebots.models.components.codecslime_masker.CodecSlimeMasker
  max_segment_length: ${max_segment_length}
  distance_mode: l2
  strategies:
    - name: random
      weight: 0.0
      params:
        mode: melt_manager
        target_mix: [0.1, 0.45, 0.25, 0.2]
        target_steps: 100000
        skip_probability: 0.5
        concentration: 30.0
        epsilon: 1.0e-6
    - name: dp
      weight: 1.0
      params:
        target_length_range: [0.5, 0.5]
    - name: keep
      weight: 0.0

loss:
  _component_: torch.nn.MSELoss
loss_gan:
  _component_: rebots.modules.gan_losses.GANLoss

loss_weights:
  loss_reconstruction: 2.0
  loss_discriminator: 1.0
  loss_adversarial: 0.5
  loss_feature_matching: 1.0
  loss_kl: 0.0001

dataset:
  _component_: external.stable_audio_tools.src.data.dataset.SampleDataset
  sample_rate: ${sample_rate}
  sample_size: ${sample_size}
  force_channels: stereo
  configs:
    - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
      id: audioset-balanced
      path: "${data_root}/audioset-balanced/"
    - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
      id: fsd50k
      path: "${data_root}/fsd50k/"
    - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
      id: bbcsoundeffects
      path: "${data_root}/bbcsoundeffects/"
    - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
      id: rwc
      path: "${data_root}/rwc/"
    - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
      id: moisesdb
      path: "${data_root}/moisesdb/"
    - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
      id: jamendo-fma
      path: "${data_root}/jamendo-fma-chunked/"
seed: null
shuffle: true

batch_size: 16
epochs: 30
optimizer:
  _component_: rebots.modules.muon.CombinedOptimizer
  lr: 5e-4
  momentum: 0.95
  adamw_lr: 5e-5
  adamw_betas: [0.9, 0.999]
  adamw_wd: 1e-4
  adamw_eps: 1.0e-15
optimizer_discriminator:
  _component_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 1e-4
max_steps_per_epoch: 5000
gradient_accumulation_steps: 1
clip_grad_norm: 50.0

compile: true
compile_mode: default
compile_dynamic: false
compile_fullgraph: false
compile_discriminator: true

device: cuda
dtype: fp32

exp_name: rebot-raw-codecslime-cool
output_dir: ${output_root}/${exp_name}
metric_logger:
  _component_: rebots.utils.metric_logging.WandBLogger
  log_dir: ${output_dir}/logs
  project: elastic-time
  name: ${exp_name}
  watch:
    log: all
    log_freq: 500

save_every_n_epochs: 1
log_every_n_steps: 1
wandb_hist_every_n_steps: 100
log_peak_memory_stats: true
