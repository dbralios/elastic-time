data_root: /path/to/data
output_root: /path/to/experiments


autoencoder:
  _component_: torch.nn.Identity

model:
  _component_: rebots.models.rebottlenecks.ReBottleneck
  encoder:
    _component_: rebots.models.components.convnext_stacks.ConvNeXtStackDownsample
    input_dim: 64
    num_blocks: 6
    hidden_dim: 1024
    stride: 2
    output_dim: 128
  decoder:
    _component_: rebots.models.components.convnext_stacks.ConvNeXtStackUpsample
    input_dim: 64
    num_blocks: 6
    hidden_dim: 1024
    stride: 2
    output_dim: 64
    use_nearest_upsample: false
  bottleneck:
    _component_: rebots.modules.vae.VAEBottleneck

discriminator:
  _component_: rebots.models.discriminators.LatentDiscriminator
  hidden_dim: 256

loss:
  _component_: torch.nn.MSELoss
loss_gan:
  _component_: rebots.modules.gan_losses.GANLoss

loss_weights:
  loss_reconstruction: 2.0
  loss_discriminator: 1.0
  loss_adversarial: 0.5
  loss_feature_matching: 1.0
  loss_kl: 0.0001

dataset:
  _component_: rebots.data.datasets.PreEncodedDataset
  latent_extension: npy
  load_mean_sigma: true
  random_crop: true
  latent_crop_length: 96
  configs:
  - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
    id: audioset-balanced
    path: ${data_root}/audioset-balanced/
  - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
    id: fsd50k
    path: ${data_root}/fsd50k/
  - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
    id: bbcsoundeffects
    path: ${data_root}/bbcsoundeffects/
  - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
    id: rwc
    path: ${data_root}/rwc/
  - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
    id: moisesdb
    path: ${data_root}/moisesdb/
  - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
    id: jamendo-fma
    path: ${data_root}/jamendo-fma-chunked
seed: null
shuffle: true
batch_size: 64
epochs: 50
optimizer:
  _component_: rebots.modules.muon.CombinedOptimizer
  lr: 0.001
  momentum: 0.95
  adamw_lr: 0.0001
  adamw_betas:
  - 0.9
  - 0.999
  adamw_wd: 0.0001
  adamw_eps: 1.0e-15
optimizer_discriminator:
  _component_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.0001
max_steps_per_epoch: 5000
gradient_accumulation_steps: 1
clip_grad_norm: 50.0

dataset_validation:
  _component_: rebots.data.datasets.PreEncodedDataset
  latent_extension: npy
  load_mean_sigma: true
  random_crop: false
  latent_crop_length: 96
  configs:
  - _component_: external.stable_audio_tools.src.data.dataset.LocalDatasetConfig
    id: songdescriber-nosinging
    path: ${data_root}/songdescriber-nosinging/
validation_batch_size: 8
validation_max_steps: 32

metrics:
- _component_: torch.nn.MSELoss
  name: mse_per_frame
  reduction: mean

compile: false
device: cuda
dtype: fp32

exp_name: rebot-preencoded-baseline-ds=2
output_dir: ${output_root}/${exp_name}
metric_logger:
  _component_: rebots.utils.metric_logging.WandBLogger
  log_dir: ${output_dir}/logs
  project: elastic-time
  name: ${exp_name}
  watch:
    log: all
    log_freq: 500

save_every_n_epochs: 1
log_every_n_steps: 1
log_peak_memory_stats: true
